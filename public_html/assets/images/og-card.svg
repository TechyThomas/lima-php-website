    <circle cx="766" cy="148" r="8" fill="#ffd166"/>
    <circle cx="792" cy="148" r="8" fill="#57e3c4"/>
  </g>
  <text x="96" y="170" fill="#57e3c4" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="5">MODERN PHP MVC FRAMEWORK</text>
  <text x="96" y="298" fill="#edf2ff" font-family="Arial, sans-serif" font-size="88" font-weight="700">Lima gives</text>
  <text x="96" y="388" fill="#edf2ff" font-family="Arial, sans-serif" font-size="88" font-weight="700">developers</text>
  <text x="96" y="478" fill="#edf2ff" font-family="Arial, sans-serif" font-size="88" font-weight="700">clean momentum.</text>
  <text x="96" y="554" fill="#afbbd8" font-family="Arial, sans-serif" font-size="32">Routing, controllers, views, and optional Twig support for developers who want structure without ceremony.</text>
  <path d="M783 218h208" stroke="#d2ff63" stroke-linecap="round" stroke-width="8"/>
  <path d="M783 258h150" stroke="#57e3c4" stroke-linecap="round" stroke-width="8"/>
  <path d="M783 316h92" stroke="#ff6b57" stroke-linecap="round" stroke-width="8"/>
  <rect x="776" y="364" width="233" height="28" rx="14" fill="#16213f"/>
  <rect x="776" y="404" width="168" height="28" rx="14" fill="#16213f"/>
  <rect x="928" y="404" width="81" height="28" rx="14" fill="#1f3057"/>
  <path d="M786 516V248c0-28.719 23.281-52 52-52" fill="none" stroke="url(#hero)" stroke-linecap="round" stroke-linejoin="round" stroke-width="22"/>
  <circle cx="1005" cy="516" r="16" fill="#d2ff63"/>
